<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger: #ef4444;
            --success: #10b981;
        }

        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #dc2626;
            --success: #059669;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding: 20px; transition: all 0.3s; }
        .container { max-width: 900px; margin: 0 auto; }
        .hidden { display: none !important; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header-actions { display: flex; gap: 10px; }

        .auth-card, .card { background: var(--bg-card); padding: 24px; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 4px 20px rgba(0,0,0,0.15); margin-bottom: 20px; }
        
        input, select, textarea, button { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 16px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-main); font-size: 14px; }
        button { background: var(--accent); color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: var(--accent-hover); }
        .btn-secondary { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); width: auto; margin: 0; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-box { background: var(--bg-card); padding: 16px; border-radius: 12px; border: 1px solid var(--border-color); text-align: center; }
        .stat-val { font-size: 20px; font-weight: bold; color: var(--accent); margin-top: 5px; }

        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .credit-card { background: linear-gradient(135deg, #2563eb, #1d4ed8); padding: 20px; border-radius: 14px; color: white; position: relative; }
        .credit-card.accent-2 { background: linear-gradient(135deg, #7c3aed, #6d28d9); }
        .credit-card.accent-3 { background: linear-gradient(135deg, #059669, #047857); }
        .card-num { font-family: monospace; font-size: 18px; letter-spacing: 2px; margin: 15px 0; }

        .tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 15px; }
        .tab-btn { background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border-color); width: auto; flex: 1; white-space: nowrap; }
        .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        .history-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--border-color); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 id="appLogoTitle">💳 CREDIT TRACKER</h1>
        <div class="header-actions">
            <button class="btn-secondary" id="langBtn" onclick="toggleLanguage()"><i class="fa-solid fa-globe"></i> EN</button>
            <button class="btn-secondary" id="themeBtn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
            <button class="btn-secondary hidden" id="logoutBtn" onclick="logout()">خروج</button>
        </div>
    </header>

    <!-- شاشة الدخول والتسجيل -->
    <div id="authSection" class="auth-card">
        <h2 id="authHeaderTitle" style="margin-bottom: 15px;">تسجيل الدخول</h2>
        <input type="text" id="username" placeholder="اسم المستخدم">
        <input type="password" id="password" placeholder="كلمة السر">
        <button onclick="login()"><span id="loginBtnText">تسجيل الدخول</span></button>
        <button class="btn-secondary" style="width:100%;" onclick="register()"><span id="regBtnText">إنشاء حساب جديد</span></button>
    </div>

    <!-- لوحة التحكم -->
    <div id="dashboardSection" class="hidden">
        <div class="stats-grid">
            <div class="stat-box"><span id="lblTotalAvail">المتاح الإجمالي</span><div class="stat-val" id="valTotalAvail">0</div></div>
            <div class="stat-box"><span id="lblTotalCurr">إجمالي المديونية الحالية</span><div class="stat-val" style="color:var(--danger);" id="valTotalCurr">0</div></div>
            <div class="stat-box"><span id="lblTotalNext">المديونية القادمة</span><div class="stat-val" id="valTotalNext">0</div></div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 id="lblMyCards">بطاقاتي الائتمانية</h3>
            <button class="btn-secondary" id="lblRolloverBtn" onclick="rolloverMonth()"><i class="fa-solid fa-rotate"></i> ترحيل للشهر الجديد</button>
        </div>

        <div id="cardsList" class="cards-grid"></div>

        <div class="card">
            <div class="tabs">
                <button class="tab-btn active" id="tabSms" onclick="switchTab('smsTab', this)">SMS Parser</button>
                <button class="tab-btn" id="tabPay" onclick="switchTab('payTab', this)">Pay Debt</button>
                <button class="tab-btn" id="tabSpend" onclick="switchTab('spendTab', this)">Log Expense</button>
                <button class="tab-btn" id="tabInsta" onclick="switchTab('instaTab', this)">InstaPay Scan</button>
                <button class="tab-btn" id="tabAdd" onclick="switchTab('addTab', this)">Add Card</button>
            </div>

            <!-- SMS Tab -->
            <div id="smsTab" class="tab-content">
                <textarea id="smsInput" rows="3" placeholder="Paste the received bank SMS text..."></textarea>
                <button id="btnParseSms" onclick="parseSMS()">Analyze SMS & Process</button>
            </div>

            <!-- Manual Pay Tab -->
            <div id="payTab" class="tab-content hidden">
                <select id="payCardSelect"></select>
                <input type="number" id="payAmount" placeholder="Amount Paid">
                <button id="btnPayManual" onclick="payManual()">Record Payment</button>
            </div>

            <!-- Spend Tab -->
            <div id="spendTab" class="tab-content hidden">
                <select id="spendCardSelect"></select>
                <input type="number" id="spendAmount" placeholder="Amount">
                <select id="spendCategory">
                    <option value="Purchases">Purchases / مشتريات</option>
                    <option value="Cash Withdrawal">Cash Withdrawal / سحب نقدي</option>
                    <option value="Bills">Bills / فواتير</option>
                </select>
                <button id="btnSpendMoney" onclick="spendMoney()">Deduct & Save Expense</button>
            </div>

            <!-- InstaPay OCR Tab -->
            <div id="instaTab" class="tab-content hidden">
                <input type="file" id="receiptFile" accept="image/*">
                <button id="btnUploadReceipt" onclick="uploadReceipt()">Upload & Scan Image</button>
            </div>

            <!-- Add Card Tab -->
            <div id="addTab" class="tab-content hidden">
                <input type="text" id="bankName" placeholder="Bank Name">
                <input type="text" id="cardNumber" placeholder="Card Number (Last 4 digits)">
                <input type="number" id="creditLimit" placeholder="Credit Limit">
                <input type="number" id="currentDebt" placeholder="Current Debt" value="0">
                <input type="number" id="dueDay" placeholder="Due Day" value="25">
                <button id="btnAddCard" onclick="addCard()">Save Credit Card</button>
            </div>
        </div>

        <div class="card">
            <h3 id="lblHistoryTitle" style="margin-bottom:15px;"><i class="fa-solid fa-clock-rotate-left"></i> Transaction & Payment History</h3>
            <div id="historyContainer"></div>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://credit-tracker-kici.onrender.com";
    let currentUserId = localStorage.getItem("userId");
    if (currentUserId === "undefined" || currentUserId === "null") currentUserId = null;
    let currentLang = localStorage.getItem("lang") || "ar";

    const translations = {
        ar: {
            authHeaderTitle: "تسجيل الدخول",
            usernamePh: "اسم المستخدم",
            passwordPh: "كلمة السر",
            loginBtnText: "تسجيل الدخول",
            regBtnText: "إنشاء حساب جديد",
            logoutBtn: "خروج",
            lblTotalAvail: "المتاح الإجمالي",
            lblTotalCurr: "إجمالي المديونية الحالية",
            lblTotalNext: "المديونية القادمة",
            lblMyCards: "بطاقاتي الائتمانية",
            lblRolloverBtn: "ترحيل للشهر الجديد",
            lblHistoryTitle: "سجل المعاملات والعمليات",
            tabSms: "تحليل SMS",
            tabPay: "سداد يدوي",
            tabSpend: "تسجيل مصاريف",
            tabInsta: "فحص انستا باي",
            tabAdd: "إضافة بطاقة",
            smsInputPh: "ألصق نص رسالة البنك هنا...",
            btnParseSms: "تحليل الرسالة وخصم المبلغ",
            payAmountPh: "المبلغ المراد سداده",
            btnPayManual: "تسجيل عملية السداد",
            spendAmountPh: "المبلغ الخصم",
            btnSpendMoney: "تسجيل الخصم",
            btnUploadReceipt: "رفع وفحص الصورة (OCR)",
            bankNamePh: "اسم البنك (مثال: البنك الأهلي)",
            cardNumberPh: "رقم البطاقة (أو آخر 4 أرقام)",
            creditLimitPh: "الحد الائتماني الكلي",
            currentDebtPh: "المديونية الحالية (إن وجدت)",
            dueDayPh: "يوم الاستحقاق في الشهر",
            btnAddCard: "حفظ البطاقة"
        },
        en: {
            authHeaderTitle: "Sign In",
            usernamePh: "Username",
            passwordPh: "Password",
            loginBtnText: "Sign In",
            regBtnText: "Create Account",
            logoutBtn: "Logout",
            lblTotalAvail: "Total Available Credit",
            lblTotalCurr: "Current Debt (Due)",
            lblTotalNext: "Upcoming Debt",
            lblMyCards: "My Credit Cards",
            lblRolloverBtn: "Rollover to Next Month",
            lblHistoryTitle: "Transaction & Payment History",
            tabSms: "SMS Parser",
            tabPay: "Pay Debt",
            tabSpend: "Log Expense",
            tabInsta: "InstaPay Scan",
            tabAdd: "Add Card",
            smsInputPh: "Paste the received bank SMS text...",
            btnParseSms: "Analyze SMS & Process",
            payAmountPh: "Amount Paid",
            btnPayManual: "Record Payment",
            spendAmountPh: "Amount",
            btnSpendMoney: "Deduct & Save Expense",
            btnUploadReceipt: "Upload & Scan Image",
            bankNamePh: "Bank Name",
            cardNumberPh: "Card Number",
            creditLimitPh: "Credit Limit",
            currentDebtPh: "Current Debt",
            dueDayPh: "Due Day",
            btnAddCard: "Save Credit Card"
        }
    };

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "light" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("theme", newTheme);
    }

    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);

    function toggleLanguage() {
        currentLang = currentLang === "ar" ? "en" : "ar";
        localStorage.setItem("lang", currentLang);
        applyLanguage();
    }

    function applyLanguage() {
        const t = translations[currentLang];
        document.documentElement.setAttribute("lang", currentLang);
        document.documentElement.setAttribute("dir", currentLang === "ar" ? "rtl" : "ltr");
        document.getElementById("langBtn").innerHTML = `<i class="fa-solid fa-globe"></i> ${currentLang === "ar" ? "EN" : "عربي"}`;

        document.getElementById("authHeaderTitle").innerText = t.authHeaderTitle;
        document.getElementById("username").placeholder = t.usernamePh;
        document.getElementById("password").placeholder = t.passwordPh;
        document.getElementById("loginBtnText").innerText = t.loginBtnText;
        document.getElementById("regBtnText").innerText = t.regBtnText;
        document.getElementById("logoutBtn").innerText = t.logoutBtn;

        document.getElementById("lblTotalAvail").innerText = t.lblTotalAvail;
        document.getElementById("lblTotalCurr").innerText = t.lblTotalCurr;
        document.getElementById("lblTotalNext").innerText = t.lblTotalNext;
        document.getElementById("lblMyCards").innerText = t.lblMyCards;
        document.getElementById("lblRolloverBtn").innerHTML = `<i class="fa-solid fa-rotate"></i> ${t.lblRolloverBtn}`;
        document.getElementById("lblHistoryTitle").innerHTML = `<i class="fa-solid fa-clock-rotate-left"></i> ${t.lblHistoryTitle}`;

        document.getElementById("tabSms").innerText = t.tabSms;
        document.getElementById("tabPay").innerText = t.tabPay;
        document.getElementById("tabSpend").innerText = t.tabSpend;
        document.getElementById("tabInsta").innerText = t.tabInsta;
        document.getElementById("tabAdd").innerText = t.tabAdd;

        document.getElementById("smsInput").placeholder = t.smsInputPh;
        document.getElementById("btnParseSms").innerText = t.btnParseSms;
        document.getElementById("payAmount").placeholder = t.payAmountPh;
        document.getElementById("btnPayManual").innerText = t.btnPayManual;
        document.getElementById("spendAmount").placeholder = t.spendAmountPh;
        document.getElementById("btnSpendMoney").innerText = t.btnSpendMoney;
        document.getElementById("btnUploadReceipt").innerText = t.btnUploadReceipt;

        document.getElementById("bankName").placeholder = t.bankNamePh;
        document.getElementById("cardNumber").placeholder = t.cardNumberPh;
        document.getElementById("creditLimit").placeholder = t.creditLimitPh;
        document.getElementById("currentDebt").placeholder = t.currentDebtPh;
        document.getElementById("dueDay").placeholder = t.dueDayPh;
        document.getElementById("btnAddCard").innerText = t.btnAddCard;
    }

    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.remove('hidden');
        btn.classList.add('active');
    }

    async function login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        
        if(!username || !password) return alert(currentLang === 'ar' ? "يرجى إدخال اسم المستخدم وكلمة السر" : "Please enter username and password");

        try {
            const res = await fetch(`${API_URL}/api/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if(res.ok) {
                currentUserId = data.user_id;
                localStorage.setItem("userId", currentUserId);
                showDashboard();
            } else {
                alert(data.detail || "بيانات الدخول غير صحيحة");
            }
        } catch(e) {
            alert("تعذر الاتصال بالسيرفر.");
        }
    }

    async function register() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        if(!username || !password) return alert(currentLang === 'ar' ? "يرجى إدخال البيانات كاملة" : "Please fill in all details");

        try {
            const res = await fetch(`${API_URL}/api/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            alert(data.message || data.detail);
        } catch(e) {
            alert("تعذر الاتصال بالسيرفر.");
        }
    }

    function showDashboard() {
        document.getElementById("authSection").classList.add("hidden");
        document.getElementById("dashboardSection").classList.remove("hidden");
        document.getElementById("logoutBtn").classList.remove("hidden");
        loadDashboard();
    }

    function logout() {
        localStorage.removeItem("userId");
        location.reload();
    }

    async function loadDashboard() {
        if(!currentUserId) return;
        try {
            const res = await fetch(`${API_URL}/api/get-dashboard/${currentUserId}`);
            const data = await res.json();
            
            const container = document.getElementById("cardsList");
            container.innerHTML = "";
            let totAvail = 0, totCurr = 0, totNext = 0;

            const cards = data.cards || [];
            if(cards.length === 0) {
                container.innerHTML = `<p style="color:var(--text-muted); grid-column:1/-1;">لا يوجد بطاقات مضافة حتى الآن.</p>`;
            }

            cards.forEach((c, idx) => {
                totAvail += c.available_credit;
                totCurr += c.current_debt;
                totNext += (c.next_month_debt || 0);
                container.innerHTML += `
                    <div class="credit-card ${idx % 3 === 1 ? 'accent-2' : idx % 3 === 2 ? 'accent-3' : ''}">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <strong>${c.bank_name}</strong>
                            <button class="btn-secondary" style="padding: 2px 8px; font-size:11px;" onclick="deleteCard('${c.card_number}')">حذف</button>
                        </div>
                        <div class="card-num">${c.card_number}</div>
                        <div style="font-size:13px;">المتاح: ${c.available_credit} EGP | المديونية: ${c.current_debt} EGP</div>
                    </div>
                `;
            });

            document.getElementById("valTotalAvail").innerText = `${totAvail} EGP`;
            document.getElementById("valTotalCurr").innerText = `${totCurr} EGP`;
            document.getElementById("valTotalNext").innerText = `${totNext} EGP`;
            populateDropdowns(cards);
            loadHistory();
        } catch(e) {
            console.error("خطأ أثناء تحميل البيانات:", e);
        }
    }

    function populateDropdowns(cards) {
        const pay = document.getElementById("payCardSelect");
        const spend = document.getElementById("spendCardSelect");
        pay.innerHTML = spend.innerHTML = "";
        cards.forEach(c => {
            const opt = `<option value="${c.card_number}">${c.bank_name} (${c.card_number})</option>`;
            pay.innerHTML += opt;
            spend.innerHTML += opt;
        });
    }

    async function loadHistory() {
        try {
            const res = await fetch(`${API_URL}/api/get-transactions/${currentUserId}`);
            const txs = await res.json();
            const container = document.getElementById("historyContainer");
            
            if(!txs || txs.length === 0) {
                container.innerHTML = `<p style="color:var(--text-muted);">لا توجد معاملات مسجلة بعد.</p>`;
                return;
            }

            container.innerHTML = txs.map(t => `
                <div class="history-item">
                    <div>
                        <div><strong>${t.category}</strong> (${t.card_number})</div>
                        <div style="font-size:11px; color:var(--text-muted);">${t.date}</div>
                    </div>
                    <strong style="color:${t.type==='payment'?'var(--success)':'var(--danger)'}">
                        ${t.type==='payment'?'+':'-'}${t.amount} EGP
                    </strong>
                </div>
            `).join('');
        } catch(e) {
            console.error(e);
        }
    }

    async function addCard() {
        const body = {
            user_id: parseInt(currentUserId),
            bank_name: document.getElementById("bankName").value,
            card_number: document.getElementById("cardNumber").value,
            credit_limit: parseFloat(document.getElementById("creditLimit").value),
            current_debt: parseFloat(document.getElementById("currentDebt").value || 0),
            due_day: parseInt(document.getElementById("dueDay").value || 25)
        };
        if(!body.bank_name || !body.card_number || isNaN(body.credit_limit)) return alert("يرجى إدخال البيانات المكتملة");

        const res = await fetch(`${API_URL}/api/add-card`, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
        if(res.ok) {
            alert("تم حفظ البطاقة بنجاح!");
            loadDashboard();
        }
    }

    async function deleteCard(cardNumber) {
        if(!confirm("هل أنت تأكد من إزالة هذه البطاقة؟")) return;
        await fetch(`${API_URL}/api/delete-card/${cardNumber}`, { method: "DELETE" });
        loadDashboard();
    }

    async function payManual() {
        const body = {
            user_id: parseInt(currentUserId),
            card_number: document.getElementById("payCardSelect").value,
            amount: parseFloat(document.getElementById("payAmount").value)
        };
        if(!body.card_number || isNaN(body.amount)) return alert("اختر البطاقة وأدخل المبلغ");

        const res = await fetch(`${API_URL}/api/pay-manual`, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
        if(res.ok) {
            alert("تم تسديد المبلغ بنجاح!");
            document.getElementById("payAmount").value = "";
            loadDashboard();
        }
    }

    async function spendMoney() {
        const body = {
            user_id: parseInt(currentUserId),
            card_number: document.getElementById("spendCardSelect").value,
            amount: parseFloat(document.getElementById("spendAmount").value),
            category: document.getElementById("spendCategory").value
        };
        if(!body.card_number || isNaN(body.amount)) return alert("اختر البطاقة وأدخل المبلغ");

        const res = await fetch(`${API_URL}/api/spend`, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
        if(res.ok) {
            alert("تم تسجيل الخصم بنجاح!");
            document.getElementById("spendAmount").value = "";
            loadDashboard();
        }
    }

    async function parseSMS() {
        const sms_text = document.getElementById("smsInput").value;
        if(!sms_text) return alert("أدخل نص الرسالة البنكية");

        const res = await fetch(`${API_URL}/api/parse-sms`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_id: parseInt(currentUserId), sms_text })
        });
        const data = await res.json();
        if(res.ok) {
            alert(data.message);
            document.getElementById("smsInput").value = "";
            loadDashboard();
        } else {
            alert(data.detail || "تعذر قراءة المبلغ من النص");
        }
    }

    async function uploadReceipt() {
        const fileInput = document.getElementById("receiptFile");
        if (!fileInput.files[0]) return alert("اختر صورة الإيصال أولاً");

        const formData = new FormData();
        formData.append("user_id", currentUserId);
        formData.append("file", fileInput.files[0]);

        try {
            const res = await fetch(`${API_URL}/api/scan-instapay`, {
                method: "POST",
                body: formData
            });
            const data = await res.json();
            if(res.ok) {
                alert(data.message || "تم فحص الإيصال بنجاح!");
                fileInput.value = "";
                loadDashboard();
            } else alert(data.detail || "تعذر قراءة الصورة");
        } catch(e) {
            alert("حدث خطأ أثناء معالجة الصورة");
        }
    }

    async function rolloverMonth() {
        if(!confirm("هل أنت متأكد من ترحيل المديونيات للشهر الجديد؟")) return;
        const res = await fetch(`${API_URL}/api/rollover-month/${currentUserId}`, { method: "POST" });
        if(res.ok) {
            alert("تم الترحيل بنجاح!");
            loadDashboard();
        }
    }

    applyLanguage();
    if (currentUserId) showDashboard();
</script>
